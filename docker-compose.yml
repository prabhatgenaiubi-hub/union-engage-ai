services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: union_engage
      POSTGRES_USER: union
      POSTGRES_PASSWORD: union
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U union -d union_engage"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://union:union@db:5432/union_engage
      JWT_SECRET: local-demo-secret
      AI_PROVIDER: sarvam
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_BASE_URL: https://api.sarvam.ai
      SARVAM_CHAT_MODEL: sarvam-105b-conversations
      SARVAM_SPEECH_MODEL: saaras:v3
      CHAT_REPLY_PROVIDER: huggingface
      LOCAL_CHAT_MODEL: gpt-oss:20b
      LOCAL_CHAT_MAX_TOKENS: 550
      HF_CHAT_TOKEN: ${HF_CHAT_TOKEN:-}
      HF_CHAT_BASE_URL: https://router.huggingface.co/v1
      HF_CHAT_MODEL: openai/gpt-oss-120b:cerebras
      HF_CHAT_MAX_TOKENS: 550
      HF_CHAT_TIMEOUT_SECONDS: 90
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3:latest
      OLLAMA_TIMEOUT_SECONDS: 90
      OLLAMA_EMBEDDING_MODEL: bge-m3
      OLLAMA_EMBEDDING_TIMEOUT_SECONDS: 180
      LOCAL_SENTIMENT_MODEL: cardiffnlp/twitter-roberta-base-sentiment-latest
      LOCAL_SENTIMENT_ENABLED: "true"
      LOCAL_SENTIMENT_LOCAL_FILES_ONLY: "false"
      LOCAL_TRANSLATION_ENABLED: "true"
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-UNION-ENGAGE-AI}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-UNION-ENGAGE-AI}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
